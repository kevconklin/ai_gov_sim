name: ci
on:
  push:
  pull_request:

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: worker}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e '.[dev]' "psycopg[binary]" pandas pyarrow pgserver
      - name: Leak check (SPEC 15)
        run: python -m sim leak-check
      - name: Tests with coverage gate
        run: pytest -q -p no:cacheprovider

  dashboard:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: dashboard}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: dashboard/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render the Kubernetes manifests
        run: kubectl kustomize deploy/k8s > /tmp/rendered.yaml
      - name: Every secretKeyRef must exist, and no real value may be committed
        run: python3 .github/scripts/check_manifests.py /tmp/rendered.yaml

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built, not pushed. A Dockerfile that stopped building is only found here otherwise.
      - name: Worker image
        uses: docker/build-push-action@v6
        with: {context: ., file: worker/Dockerfile, push: false, cache-from: "type=gha", cache-to: "type=gha,mode=max"}
      - name: Dashboard image
        uses: docker/build-push-action@v6
        with: {context: dashboard, file: dashboard/Dockerfile, push: false, cache-from: "type=gha", cache-to: "type=gha,mode=max"}
