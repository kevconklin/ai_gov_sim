[project]
name = "governance-sim-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.6",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=16",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "pytest-cov>=5", "psycopg[binary]>=3.2", "pgserver>=0.1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sim*"]

[tool.setuptools.package-data]
"sim.prompts" = ["committee/*", "world/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sim --cov-report=term-missing --cov-fail-under=80"
