# Nightly backup set: pg_dump plus the policy repositories, written to the backups volume. The
# volume is a staging area; a second job or the cluster's storage layer must carry each set off
# the cluster, and `python -m sim restore` must be run as a drill on a schedule, not only in anger.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  namespace: govsim
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
            - name: backup
              image: ghcr.io/REPLACE/govsim-worker:0.1.0
              command: ["python", "-m", "sim", "backup", "--out", "/backups", "--keep", "14"]
              env:
                - name: SIM_SKIP_MIGRATIONS
                  value: "1"
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: govsim, key: DATABASE_URL } }
                - name: SIM_DATA_DIR
                  value: /data
              volumeMounts:
                - { name: data, mountPath: /data, readOnly: true }
                - { name: backups, mountPath: /backups }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: "1", memory: 1Gi }
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: govsim-worker-data }
            - name: backups
              persistentVolumeClaim: { claimName: govsim-backups }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: govsim-backups
  namespace: govsim
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
