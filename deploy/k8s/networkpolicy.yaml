# Default deny, then open only what each component needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: govsim
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard
  namespace: govsim
spec:
  podSelector:
    matchLabels: { app: govsim, component: dashboard }
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports:
        - { protocol: TCP, port: 3100 }
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Postgres only. The dashboard never calls an LLM.
    - ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker
  namespace: govsim
spec:
  podSelector:
    matchLabels: { app: govsim, component: worker }
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Probes only. Nothing calls into the worker; control reaches it through the commands table.
    - ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Postgres, plus HTTPS for the Anthropic API, object storage, and the alert webhook.
    # Pinning those to CIDRs is not practical against provider IP ranges that move; if your
    # cluster has an egress gateway or a Cilium FQDN policy, narrow this to api.anthropic.com
    # and your storage host there instead.
    - ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 443 }
