# Example only. Do not apply this file with real values committed to git.
# Use External Secrets, Sealed Secrets, or `kubectl create secret generic` from a vault.
apiVersion: v1
kind: Secret
metadata:
  name: govsim
  namespace: govsim
type: Opaque
stringData:
  # Paid API. A crash-looping worker holds this key, so keep the spend cap in
  # config/budget.yaml low until a deploy has proven itself.
  ANTHROPIC_API_KEY: "sk-ant-REPLACE"
  # Optional. Set the ones whose models a customer's committee should be able to use; a seat
  # cannot be given a model whose provider has no key here. See config/providers.yaml.
  OPENAI_API_KEY: ""
  HF_TOKEN: ""

  # Worker role: read/write. Migrations run as a separate Job with an owner connection.
  DATABASE_URL: "postgresql://sim_worker:REPLACE@postgres:5432/govsim"
  DATABASE_URL_MIGRATE: "postgresql://sim_owner:REPLACE@postgres:5432/govsim"

  # Dashboard: read-only for pages, a control role that may only insert commands
  # and interventions.
  DATABASE_URL_READ: "postgresql://dashboard_readonly:REPLACE@postgres:5432/govsim"
  DATABASE_URL_CONTROL: "postgresql://dashboard_control:REPLACE@postgres:5432/govsim"

  DASHBOARD_PASSWORD: "REPLACE"
  DASHBOARD_SESSION_SECRET: "REPLACE-with-at-least-32-random-characters"

  # Optional: checkpoint and export uploads, and alerting.
  SUPABASE_URL: ""
  SUPABASE_SERVICE_ROLE_KEY: ""
  SUPABASE_STORAGE_BUCKET: "sim-artifacts"
  ALERT_WEBHOOK_URL: ""
