# Event schedule and probability tables (SPEC 6.4). PLACEHOLDER probabilities.
# scope: exogenous events are drawn identically for both banks in a replicate;
#        bank events use the same uniform draw but a probability that depends on bank state.
scheduled:
  board_memo: {months_of_year: [1, 4, 7, 10], skip_first_month: true}
  budget_cycle: {month_of_year: 1, skip_first_month: true}
  full_scope_exam: {every_months: 12}

targeted_review_triggers:
  high_severity_incident: true
  complaint_rate_multiple_of_baseline: 1.5
  fair_lending_exposure_above: 60
  cooldown_months: 6

news:
  seed_items_per_month: 3
  optional_extra_items: 1          # skipped when a bank is over its monthly spend cap

staff_voices:
  prob_per_month: 0.5              # optional; skipped when over cap

random:
  vendor_pitch:          {scope: exogenous, prob: 0.55, channel: inbox, severity: low}
  competitor_launch:     {scope: exogenous, prob: 0.25, channel: news, severity: low}
  regulator_guidance:    {scope: exogenous, prob: 0.15, channel: news, severity: low}
  key_staff_resignation: {scope: exogenous, prob: 0.05, channel: inbox, severity: medium}
  press_inquiry:         {scope: bank, prob: 0.06, per_high_incident_last_month: 0.35, channel: inbox, severity: medium}
  shadow_ai_discovery:   {scope: bank, prob_per_shadow_rate: 0.6, channel: inbox, severity: medium}
  data_leak:             {scope: bank, prob: 0.006, per_live_customer_facing_use_case: 0.004, channel: inbox, severity: high}
  complaint_wave:        {scope: bank, prob: 0.02, if_complaint_rate_multiple_above: 1.3, elevated_prob: 0.25, channel: inbox, severity: medium}
  morale_issue:          {scope: bank, prob: 0.03, if_morale_below: 55, elevated_prob: 0.2, channel: inbox, severity: low}

injectable_types: [vendor_pitch, competitor_launch, shadow_ai_discovery, data_leak, model_error, complaint_wave,
                   regulator_guidance, press_inquiry, morale_issue, key_staff_resignation]
