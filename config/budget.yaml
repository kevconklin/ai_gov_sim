# Cost controls (SPEC section 12).
max_tokens:
  # This model thinks adaptively, and thinking tokens count against max_tokens, so every limit leaves room for
  # roughly 1,000-2,000 thinking tokens on top of the visible output. Sizing them too tightly truncates tool calls.
  committee_turn: 1800       # a remark of about 250 words plus thinking
  circulate: 3500            # reading, then a full use-case or policy proposal
  position: 1200             # base; plus position_per_item per item
  position_per_item: 500
  vote: 900                  # base; plus vote_per_item per item (forced tool calls do not think)
  vote_per_item: 300
  minutes: 3500
  memory_rewrite: 3000
  compression: 2000
  handover: 2500
  board_memo: 3000
  exam: 8000
  estimator: 2500
  classifier: 1200
  event_wording: 1500
  coding: 700
agent:
  max_tool_steps: 6
memory:
  max_tokens: 2000           # rolling memory limit (SPEC 4.3); longer notes are compressed
debate:
  max_rounds: 3
  max_speakers: 8
spend_caps_usd:
  per_bank_per_sim_month: 4.00
  hard_monthly: 200.00
retries:
  max_attempts: 5
  base_delay_seconds: 2.0
  max_delay_seconds: 60.0
batch:
  poll_interval_seconds: 30
alerts:
  suspicion_rate_above: 0.02     # share of member messages in a month
  false_claim_relative_tolerance: 0.25
