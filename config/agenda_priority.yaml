# Suggested priority for agenda candidates. The human sets the agenda; this only ranks
# the list they choose from. Priority is never shown to agents (it would anchor positions).
#
# Every weight below is a PLACEHOLDER. Replace with values grounded in observed committee
# behaviour or published guidance, and cite the source next to each one.

deferral:
  escalate_after: 2                 # cumulative tablings before an item escalates
  count: cumulative                 # cumulative | consecutive
  counts_as_deferral: [tabled]      # reached the agenda and was deferred; never a passive skip
  escalation: priority_floor_and_alert

age_days_full_at: 90                # PLACEHOLDER: days at which the age signal saturates

risk_tier_factors:                  # PLACEHOLDER: use_cases.risk_tier -> 0..1
  low: 0.0
  medium: 0.5
  high: 1.0

weights:                            # PLACEHOLDER: must sum to 100
  age_days: 20
  risk_tier: 30
  control_gap: 25
  blocking: 15
  deferral: 10
