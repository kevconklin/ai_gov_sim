vendors:
  - key: brevanta
    name: "Brevanta"
    category: "Generative AI platform"
    description: "Enterprise generative AI platform provider headquartered outside Minneapolis, about 410 employees. Sells hosted assistants, document summarization, and a retrieval layer over internal content. Customers include insurers and community banks."
    products:
      - {name: "Brevanta Workspace", description: "Staff-facing chat assistant with retrieval over internal policies and procedures, single sign-on, admin console, usage logs.", pricing_note: "$38 per seat per month, 500-seat minimum; implementation fee $145,000"}
      - {name: "Brevanta Summarize", description: "Summarizes call transcripts, loan files, and complaint narratives into structured notes.", pricing_note: "$0.019 per document page plus $60,000 annual platform fee"}
  - key: quarrystone
    name: "Quarrystone Core Systems"
    category: "Core banking"
    description: "Large core banking provider serving about 1,900 banks and credit unions. Incumbent core vendor for the Bank. Slow release cycle; now marketing AI add-on modules sold through its partner marketplace."
    products:
      - {name: "Meridian Core", description: "Core deposit and loan processing platform.", pricing_note: "Existing contract; renewal due in 2029"}
      - {name: "Meridian Insight AI", description: "Add-on predictive module for deposit attrition and next-best-product, trained on the core's own data model.", pricing_note: "$412,000 per year for banks $10B-$25B in assets; 14-month typical implementation"}
  - key: sablecrest
    name: "Sablecrest Analytics"
    category: "Fraud detection"
    description: "Fraud and financial crime analytics vendor. Supplies the Bank's current card transaction fraud scores. Pushing an upgrade to deep-learning models and real-time payments fraud coverage."
    products:
      - {name: "CardGuard", description: "Card transaction fraud scoring, in production at the Bank since 2019.", pricing_note: "Existing contract, about $0.004 per scored transaction"}
      - {name: "PayStream Sentinel", description: "Real-time payments and ACH fraud scoring with behavioral biometrics and scam-intervention warnings.", pricing_note: "$690,000 per year plus $210,000 one-time integration"}
  - key: ravelle
    name: "Ravelle Decisioning"
    category: "Credit underwriting"
    description: "Machine-learning credit underwriting vendor for consumer installment, auto, and card lending. Claims 15-25% more approvals at constant loss rates using cash-flow and alternative data. Provides reason codes for adverse action notices."
    products:
      - {name: "Ravelle Approve", description: "ML underwriting model with custom training on the lender's historical applications and performance.", pricing_note: "$1.85 per decision plus $275,000 annual platform fee; model build $180,000"}
      - {name: "Ravelle Fairness Monitor", description: "Disparate impact testing and less-discriminatory-alternative search for Ravelle models.", pricing_note: "$96,000 per year"}
  - key: callowen
    name: "Callowen"
    category: "Contact center voice AI"
    description: "Voice AI vendor that automates inbound phone calls (balance inquiries, card activation, payment arrangements) and gives human representatives live suggested responses."
    products:
      - {name: "Callowen Voice Assistant", description: "Automated voice handling for routine inbound calls with handoff to a human.", pricing_note: "$0.61 per automated call; vendor projects 38% call containment"}
      - {name: "Callowen Assist", description: "Real-time transcription and suggested answers for human contact center staff.", pricing_note: "$74 per representative seat per month"}
  - key: meridel
    name: "Meridel CRM"
    category: "Customer relationship management"
    description: "CRM vendor used by the Bank since 2021. Selling an AI add-on for lead scoring and generated outreach."
    products:
      - {name: "Meridel Pulse AI", description: "Lead scoring, next-best-action, and generated email and text outreach drafts for bankers.", pricing_note: "$29 per user per month on top of existing licenses; 1,100-user minimum"}
  - key: orrin_signal
    name: "Orrin Signal"
    category: "Marketing personalization"
    description: "Marketing technology firm that builds propensity models and generates personalized offers, ad copy, and landing pages. Strong with retailers, newer to banking."
    products:
      - {name: "Orrin Audiences", description: "Look-alike and propensity modeling for customer acquisition using first-party and purchased third-party data.", pricing_note: "$340,000 per year plus media spend"}
      - {name: "Orrin Creative", description: "Generates personalized ad variants, emails, and offer copy at scale with brand-rule checks.", pricing_note: "$11,500 per month, unlimited variants"}
  - key: tallyhand
    name: "Tallyhand"
    category: "Productivity assistant"
    description: "Office productivity assistant that plugs into email, calendar, and documents to draft messages, summarize meetings, and search files."
    products:
      - {name: "Tallyhand for Enterprise", description: "Email drafting, meeting notes, and document search across the Bank's office suite.", pricing_note: "$24 per user per month; data residency add-on $3 per user"}
  - key: halvard
    name: "Halvard Security"
    category: "AI security and monitoring"
    description: "Security vendor offering discovery of unapproved AI tool usage, data loss prevention for text and files sent to AI tools, and red-team testing of AI applications."
    products:
      - {name: "Halvard Discover", description: "Detects staff use of outside AI tools via network and browser telemetry and blocks sensitive data uploads.", pricing_note: "$8.40 per employee per month"}
      - {name: "Halvard Red Team", description: "Adversarial testing engagement for customer-facing AI applications.", pricing_note: "$68,000 per engagement"}
  - key: coppervane
    name: "Coppervane Cloud"
    category: "Cloud hosting and AI infrastructure"
    description: "Cloud provider hosting part of the Bank's data warehouse. Offers a managed gateway to several large AI systems with logging, redaction, and cost controls."
    products:
      - {name: "Coppervane AI Gateway", description: "Managed access to hosted large AI systems with content logging, PII redaction, and spending limits.", pricing_note: "Usage-based; vendor estimates $18,000-$55,000 per month for a bank this size at moderate use"}
      - {name: "Coppervane Lakehouse", description: "Managed analytics platform to replace the on-premises warehouse.", pricing_note: "$1.2M migration estimate; $41,000 per month run rate"}
  - key: ledgerlight
    name: "Ledgerlight"
    category: "AML and compliance automation"
    description: "Anti-money-laundering vendor applying machine learning to alert triage and suspicious activity report drafting."
    products:
      - {name: "Ledgerlight Triage", description: "Scores and prioritizes transaction monitoring alerts; claims 44% reduction in false-positive review time.", pricing_note: "$520,000 per year"}
      - {name: "Ledgerlight Narrative", description: "Drafts SAR narratives from case files for investigator review.", pricing_note: "$145 per filed report"}
  - key: aldermoor
    name: "Aldermoor Advisory"
    category: "Consulting — model validation and risk"
    description: "Consulting firm with offices in Tamsin City and three other Midwest cities. Independent model validation, fair lending testing, and AI governance program design for banks under $50B."
    products:
      - {name: "Independent Model Validation", description: "Validation of vendor and internal models, including conceptual soundness, outcomes analysis, and monitoring design.", pricing_note: "$85,000-$240,000 per model depending on complexity"}
      - {name: "Governance Program Build", description: "Policy drafting, inventory, and control design engagement.", pricing_note: "$310,000 fixed fee, 16 weeks"}
  - key: hollis_crane
    name: "Hollis & Crane Data"
    category: "Data engineering services"
    description: "Data engineering and analytics consultancy. Builds data pipelines, customer data platforms, and data quality programs for regional banks and health systems."
    products:
      - {name: "Customer 360 Accelerator", description: "Household matching, master data cleanup, and a unified customer view feeding CRM and analytics.", pricing_note: "$685,000 fixed fee over 7 months"}
      - {name: "Data Quality Sprint", description: "Six-week assessment and remediation of priority data domains.", pricing_note: "$128,000"}
  - key: cordwain
    name: "Cordwain Systems"
    category: "Document AI"
    description: "Document processing vendor that extracts data from tax returns, pay stubs, bank statements, and business financials for loan origination."
    products:
      - {name: "Cordwain Intake", description: "Document classification and extraction for mortgage, consumer, and small business loan files.", pricing_note: "$2.10 per loan file; $90,000 annual minimum"}

