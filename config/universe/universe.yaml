# Company reference data: region, institution facts, staff directory, vendors, market, media, supervisors.

region:
  name: "Tamsin Valley"
  description: >-
    A fourteen-county region along the Tamsin River in the upper Midwest, population about 2.36 million.
    The economy rests on precision manufacturing (agricultural equipment, auto parts, industrial pumps),
    grain and dairy, a regional logistics corridor built around two interstates and the Harrow Mills rail
    yards, the Tamsin Health system, and Tamsin State University. Unemployment has run between 3.6% and
    4.4% for three years. Housing is affordable by national standards (median home price about $241,000),
    small business formation is steady, and the population is aging slightly faster than the national
    average. Winters are long, the river floods every few springs, and people tend to bank where their
    parents banked.
  cities:
    - {name: "Tamsin City", population: 684200, note: "Regional hub and county seat; home to the Bank's headquarters, Tamsin Health, and the state university's main campus"}
    - {name: "Kestrel Bend", population: 118450, note: "River port and grain terminal city; large farm-equipment plant"}
    - {name: "Harrow Mills", population: 96730, note: "Rail yards, warehousing, and a growing third-party logistics cluster"}
    - {name: "Pruett Landing", population: 61280, note: "Older mill town, heavy manufacturing, active trade unions"}
    - {name: "New Callan", population: 54910, note: "Fast-growing suburb northwest of Tamsin City; young families, new construction"}
    - {name: "Ashgrove Heights", population: 47365, note: "Affluent suburb; wealth management clients, medical professionals"}
    - {name: "Greaves Crossing", population: 33140, note: "Agricultural trade town; dairy cooperatives and seed dealers"}
    - {name: "Oswin Falls", population: 28870, note: "Regional college town and small tourism economy around the falls"}
    - {name: "Lorne Prairie", population: 19420, note: "Farming community with a large retirement population"}
    - {name: "Marrowby", population: 12685, note: "County seat in the southern valley; food processing plant is the largest employer"}

